<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AUTO ACADEMY - Bài 01</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 16px;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    color: #1f2937;
}

.container {
    width: 100%;
    max-width: 1050px;
    margin: 0 auto;
}

.header {
    background: white;
    padding: 20px;
    border-radius: 14px;
    text-align: center;
    margin-bottom: 16px;
}

.title {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 8px;
}

.subtitle {
    font-size: 18px;
    color: #555;
}

.timer-box {
    background: white;
    padding: 20px;
    border-radius: 14px;
    text-align: center;
    margin-bottom: 16px;
}

.label {
    font-size: 14px;
    color: #666;
}

#timer {
    font-size: 40px;
    font-weight: bold;
    letter-spacing: 2px;
    margin: 10px 0 18px;
}

button {
    border: none;
    border-radius: 9px;
    padding: 14px 26px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

#startBtn {
    background: #2563eb;
    color: white;
}

#finishBtn {
    display: none;
    background: #dc2626;
    color: white;
    margin: 20px auto;
}

#finishBtn:hover {
    opacity: 0.9;
}

#status {
    display: none;
    margin-top: 12px;
    color: #dc2626;
    font-weight: bold;
}

.note {
    margin-top: 10px;
    font-size: 13px;
    color: #777;
}

#formBox {
    display: none;
    background: white;
    border-radius: 14px;
    overflow: hidden;
}

#formFrame {
    display: block;
    width: 100%;
    height: 1800px;
    border: none;
}

#result {
    display: none;
    background: white;
    border-radius: 14px;
    padding: 25px;
    text-align: center;
    margin-top: 16px;
}

.result-title {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 15px;
}

.final-time {
    font-size: 36px;
    font-weight: bold;
    margin: 15px 0;
}

.finish-note {
    color: #555;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="title">
            📝 AUTO ACADEMY - Bài 01
        </div>

        <div class="subtitle">
            ガソリンエンジンの復習問題
        </div>
    </div>


    <!-- ĐỒNG HỒ -->
    <div class="timer-box">

        <div class="label">
            ⏱ THỜI GIAN LÀM BÀI
        </div>

        <div id="timer">
            00:00:00
        </div>

        <!-- BẮT ĐẦU -->
        <button id="startBtn">
            ▶ BẮT ĐẦU LÀM BÀI
        </button>

        <!-- TRẠNG THÁI -->
        <div id="status">
            🔴 ĐANG LÀM BÀI
        </div>

        <div class="note">
            Sau khi nộp bài, hãy bấm "KẾT THÚC BÀI" để dừng đồng hồ.
        </div>

    </div>


    <!-- GOOGLE FORM -->
    <div id="formBox">

        <iframe
            id="formFrame"
            title="AUTO ACADEMY - Bài 01">
        </iframe>

        <!-- NÚT KẾT THÚC -->
        <div style="text-align:center; padding:10px 20px 25px;">

            <button id="finishBtn">
                ⏹ KẾT THÚC BÀI
            </button>

        </div>

    </div>


    <!-- KẾT QUẢ THỜI GIAN -->
    <div id="result">

        <div class="result-title">
            ✅ ĐÃ KẾT THÚC BÀI
        </div>

        <div>
            Thời gian làm bài:
        </div>

        <div class="final-time" id="finalTime">
            00:00:00
        </div>

        <div class="finish-note">
            Bạn đã hoàn thành bài làm.
        </div>

    </div>

</div>


<script>

let seconds = 0;
let timerInterval = null;

const timer = document.getElementById("timer");
const startBtn = document.getElementById("startBtn");
const finishBtn = document.getElementById("finishBtn");
const status = document.getElementById("status");

const formBox = document.getElementById("formBox");
const formFrame = document.getElementById("formFrame");

const result = document.getElementById("result");
const finalTime = document.getElementById("finalTime");


/*
   Định dạng thời gian
*/
function formatTime(totalSeconds) {

    const hours =
        Math.floor(totalSeconds / 3600);

    const minutes =
        Math.floor((totalSeconds % 3600) / 60);

    const secs =
        totalSeconds % 60;

    return String(hours).padStart(2, "0")
        + ":"
        + String(minutes).padStart(2, "0")
        + ":"
        + String(secs).padStart(2, "0");
}


/*
   BẮT ĐẦU LÀM BÀI
*/
startBtn.addEventListener("click", function() {

    if (timerInterval !== null) {
        return;
    }


    /*
       Link Google Form
    */
    formFrame.src =
        "https://docs.google.com/forms/d/e/1FAIpQLSexUhpWD8diER_x2WkHTPug9GGTS8czdM47IF0OQnazjvNFAg/viewform?embedded=true";


    /*
       Hiện Form
    */
    formBox.style.display = "block";


    /*
       Ẩn nút bắt đầu
    */
    startBtn.style.display = "none";


    /*
       Hiện trạng thái
    */
    status.style.display = "block";


    /*
       Hiện nút kết thúc
    */
    finishBtn.style.display = "inline-block";


    /*
       Bắt đầu đồng hồ
    */
    timerInterval = setInterval(function() {

        seconds++;

        timer.textContent =
            formatTime(seconds);

    }, 1000);


    /*
       Cuộn xuống Form
    */
    setTimeout(function() {

        formBox.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }, 300);

});


/*
   KẾT THÚC BÀI
*/
finishBtn.addEventListener("click", function() {

    /*
       Dừng đồng hồ
    */
    clearInterval(timerInterval);

    timerInterval = null;


    /*
       Hiển thị thời gian cuối cùng
    */
    finalTime.textContent =
        formatTime(seconds);


    /*
       Ẩn Form
    */
    formBox.style.display = "none";


    /*
       Ẩn trạng thái đang làm
    */
    status.style.display = "none";


    /*
       Hiện kết quả
    */
    result.style.display = "block";


    /*
       Cuộn xuống kết quả
    */
    setTimeout(function() {

        result.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    }, 200);

});

</script>

</body>
</html>
