<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AUTO ACADEMY - 復習問題</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 16px;
    font-family: Arial, "Noto Sans JP", sans-serif;
    background: #f4f6f9;
    color: #222;
}

.container {
    width: 100%;
    max-width: 1050px;
    margin: 0 auto;
}

/* タイトル */

.header {
    background: white;
    padding: 20px;
    border-radius: 14px;
    text-align: center;
    margin-bottom: 16px;
}

.title {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 8px;
}

.subtitle {
    font-size: 18px;
    color: #555;
}

/* 時計 */

.timer-box {
    background: white;
    padding: 24px;
    border-radius: 14px;
    text-align: center;
    margin-bottom: 16px;
}

.label {
    font-size: 15px;
    color: #666;
}

#timer {
    font-size: 42px;
    font-weight: bold;
    letter-spacing: 2px;
    margin: 10px 0 20px;
}

/* ボタン共通 */

button {
    border: none;
    border-radius: 9px;
    padding: 14px 32px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

/* 開始ボタン */

#startBtn {
    background: #2563eb;
    color: white;
}

#startBtn:hover {
    opacity: 0.9;
}

/* 終了ボタン */

#finishBtn {
    display: none;
    background: #dc2626;
    color: white;
    margin: 20px auto;
}

#finishBtn:hover {
    opacity: 0.9;
}

/* 状態 */

#status {
    display: none;
    margin-top: 12px;
    color: #dc2626;
    font-size: 17px;
    font-weight: bold;
}

.note {
    margin-top: 12px;
    font-size: 13px;
    color: #777;
}

/* Google Form */

#formBox {
    display: none;
    background: white;
    border-radius: 14px;
    overflow: hidden;
}

#formFrame {
    display: block;
    width: 100%;
    height: 1800px;
    border: none;
}

/* 終了画面 */

#result {
    display: none;
    background: white;
    border-radius: 14px;
    padding: 30px;
    text-align: center;
    margin-top: 16px;
}

.result-title {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 15px;
}

.final-time {
    font-size: 40px;
    font-weight: bold;
    margin: 15px 0;
}

.finish-note {
    color: #555;
    font-size: 16px;
}

</style>
</head>


<body>

<div class="container">


    <!-- タイトル -->

    <div class="header">

        <div class="title">
            AUTO ACADEMY
        </div>

        <div class="subtitle">
            ガソリンエンジンの復習問題
        </div>

    </div>


    <!-- 時計 -->

    <div class="timer-box">

        <div class="label">
            ⏱ 試験時間
        </div>


        <div id="timer">
            00:00:00
        </div>


        <!-- 開始ボタン -->

        <button id="startBtn">
            ▶ 試験開始
        </button>


        <!-- 試験中 -->

        <div id="status">
            🔴 試験中
        </div>


        <div class="note">
            「試験開始」を押すと試験が始まります。
        </div>

    </div>


    <!-- Google Form -->

    <div id="formBox">

        <iframe
            id="formFrame"
            title="AUTO ACADEMY 復習問題">
        </iframe>


        <!-- 終了ボタン -->

        <div style="text-align:center; padding:10px 20px 30px;">

            <button id="finishBtn">
                ⏹ 試験終了
            </button>

        </div>

    </div>


    <!-- 終了結果 -->

    <div id="result">

        <div class="result-title">
            ✅ 試験終了
        </div>


        <div>
            試験時間
        </div>


        <div class="final-time" id="finalTime">
            00:00:00
        </div>


        <div class="finish-note">
            お疲れさまでした。
        </div>

    </div>


</div>


<script>


/* =========================
   初期設定
========================= */

let seconds = 0;

let timerInterval = null;


/* HTML要素 */

const timer =
    document.getElementById("timer");

const startBtn =
    document.getElementById("startBtn");

const finishBtn =
    document.getElementById("finishBtn");

const status =
    document.getElementById("status");

const formBox =
    document.getElementById("formBox");

const formFrame =
    document.getElementById("formFrame");

const result =
    document.getElementById("result");

const finalTime =
    document.getElementById("finalTime");


/* =========================
   Google Form BÀI 2
========================= */

const FORM_URL =
"https://docs.google.com/forms/d/e/1FAIpQLSf_C2qS06piP4_7zRyLoR9jN28aADDgJzpLZmMNzGZjxQJOpg/viewform?embedded=true";


/* =========================
   時間表示
========================= */

function formatTime(totalSeconds) {

    const hours =
        Math.floor(totalSeconds / 3600);

    const minutes =
        Math.floor((totalSeconds % 3600) / 60);

    const secs =
        totalSeconds % 60;


    return (
        String(hours).padStart(2, "0")
        + ":"
        + String(minutes).padStart(2, "0")
        + ":"
        + String(secs).padStart(2, "0")
    );
}


/* =========================
   試験開始
========================= */

startBtn.addEventListener("click", function() {


    /* 二重開始防止 */

    if (timerInterval !== null) {
        return;
    }


    /* Google Formを読み込む */

    formFrame.src = FORM_URL;


    /* Formを表示 */

    formBox.style.display = "block";


    /* 開始ボタンを隠す */

    startBtn.style.display = "none";


    /* 試験中表示 */

    status.style.display = "block";


    /* 終了ボタンを表示 */

    finishBtn.style.display = "inline-block";


    /* 時計スタート */

    timerInterval = setInterval(function() {

        seconds++;

        timer.textContent =
            formatTime(seconds);

    }, 1000);


    /* Formまでスクロール */

    setTimeout(function() {

        formBox.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }, 500);

});


/* =========================
   試験終了
========================= */

finishBtn.addEventListener("click", function() {


    /* 時計停止 */

    if (timerInterval !== null) {

        clearInterval(timerInterval);

        timerInterval = null;

    }


    /* 最終時間 */

    finalTime.textContent =
        formatTime(seconds);


    /* Formを隠す */

    formBox.style.display = "none";


    /* 試験中表示を隠す */

    status.style.display = "none";


    /* 終了結果を表示 */

    result.style.display = "block";


    /* 終了結果へ移動 */

    setTimeout(function() {

        result.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    }, 300);

});


</script>

</body>
</html>
