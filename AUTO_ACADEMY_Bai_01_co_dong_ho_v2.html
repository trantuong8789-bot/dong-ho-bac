<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AUTO ACADEMY – Bài 01</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;font-family:Arial,sans-serif;background:#f4f6f9;color:#1f2937}.wrap{max-width:1050px;margin:auto}
.header,.timer-box,#formBox{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:16px}.header{text-align:center}.title{font-size:24px;font-weight:bold;margin-bottom:8px}.subtitle{font-size:18px;color:#4b5563}.timer-box{text-align:center}.label{font-size:14px;color:#6b7280}#timer{font-size:38px;font-weight:bold;letter-spacing:2px;font-variant-numeric:tabular-nums;margin:8px 0 14px}#startBtn{border:0;border-radius:9px;background:#2563eb;color:white;padding:14px 24px;font-size:16px;font-weight:bold;cursor:pointer}#status{display:none;margin-top:12px;color:#dc2626;font-weight:bold}.note{font-size:13px;color:#6b7280;margin-top:10px}#formBox[hidden]{display:none!important}#formBox{padding:0;overflow:hidden}#formFrame{display:block;width:100%;height:1800px;border:0}
</style></head><body><main class="wrap">
<section class="header"><div class="title">📝 AUTO ACADEMY – Bài 01</div><div class="subtitle">ガソリンエンジンの復習問題</div></section>
<section class="timer-box"><div class="label">⏱ THỜI GIAN LÀM BÀI</div><div id="timer">00:00:00</div><button id="startBtn" type="button">▶ BẮT ĐẦU LÀM BÀI</button><div id="status">🔴 ĐANG LÀM BÀI</div><div class="note">Nhấn nút bắt đầu để mở đề và tính thời gian làm bài.</div></section>
<section id="formBox" hidden><iframe id="formFrame" title="AUTO ACADEMY – Bài 01"></iframe></section>
</main><script>
(function(){const btn=document.getElementById('startBtn'),timer=document.getElementById('timer'),status=document.getElementById('status'),box=document.getElementById('formBox'),frame=document.getElementById('formFrame');let seconds=0,interval=null;
function fmt(n){return [Math.floor(n/3600),Math.floor(n%3600/60),n%60].map(x=>String(x).padStart(2,'0')).join(':')}
btn.addEventListener('click',function(){if(interval!==null)return;try{localStorage.setItem('bac_bai01_start_time',new Date().toISOString())}catch(e){}btn.hidden=true;status.style.display='block';box.hidden=false;frame.src='https://docs.google.com/forms/d/e/1FAIpQLSexUhpWD8diER_x2WkHTPug9GGTS8czdM47IF0OQnazjvNFAg/viewform?embedded=true';interval=setInterval(function(){seconds++;timer.textContent=fmt(seconds)},1000);setTimeout(function(){box.scrollIntoView({behavior:'smooth',block:'start'})},100)});
})();
</script></body></html>
